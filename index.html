<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone - 200+ Games</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🎮 GameZone</h1>
  <p>200+ games in one place</p>

  <input
    id="search"
    type="text"
    placeholder="🔎 Search games..."
    oninput="searchGames()"
  >
</header>

<nav>
  <button onclick="showCategory('all')">All</button>
  <button onclick="showCategory('arcade')">Arcade</button>
  <button onclick="showCategory('action')">Action</button>
  <button onclick="showCategory('puzzle')">Puzzle</button>
  <button onclick="showCategory('sports')">Sports</button>
  <button onclick="showCategory('classic')">Classic</button>
</nav>

<main id="games"></main>

<div id="gameWindow" class="game-window">
  <div class="game-top">
    <h2 id="gameTitle">Game</h2>
    <button onclick="closeGame()">✕</button>
  </div>

  <div id="gameArea"></div>
</div>

<script>
const specialGames = [
  ["Retro Bowl", "sports", "🏈"],
  ["Balatro", "classic", "🃏"],
  ["Ultra Pool", "sports", "🎱"]
];

const gameNames = [
"Space Runner","Pixel Jump","Flappy Bird","Snake","Dodge Blocks",
"Rocket Rush","Coin Collector","Alien Attack","Meteor Storm","Ninja Dash",
"Cube Runner","Color Switch","Jump Master","Ball Bounce","Laser Dodge",
"Asteroid Field","Tower Climber","Sky Fighter","Robot Run","Monster Dash",
"Fireball Dodge","Speed Racer","Pixel Fighter","Star Catcher","Gravity Ball",
"Block Breaker","Brick Smash","Target Shooter","Cannon Shot","Tank Battle",
"Mini Golf","Basketball Challenge","Football Kick","Penalty Shootout","Tennis Star",
"Baseball Hero","Hockey Shootout","Boxing Champion","Skate Rush","Pool Master",
"Chess Mini","Checkers","Memory Match","2048 Mini","Minesweeper",
"Tic Tac Toe","Connect Four","Word Guess","Number Guess","Reaction Test",
"Simon Says","Color Match","Math Challenge","Quick Tap","Pattern Memory",
"Puzzle Blocks","Sliding Puzzle","Maze Runner","Escape Room","Jigsaw Mini",
"Bubble Pop","Match Three","Candy Match","Gem Crush","Tile Master",
"Space Invaders","Galactic War","Zombie Attack","Vampire Hunter","Samurai Slash",
"Ninja Fighter","Pirate Battle","Knight Quest","Dungeon Run","Dragon Attack",
"Robot Battle","Cyber Runner","Laser Quest","Alien Shooter","Battle Arena",
"Car Racer","Street Racer","Drift King","Traffic Dodge","Highway Rush",
"Monster Truck","Rally Racer","Kart Dash","Bike Race","Jet Ski",
"Snowboard Rush","Ski Racer","Skateboard Pro","Hoverboard Hero","Rocket Car",
"Fruit Slice","Knife Throw","Bottle Flip","Stack Tower","Helicopter",
"Paper Plane","Cannon Master","Bow Master","Arrow Dodge","Target Master",
"Fishing Frenzy","Duck Hunt","Chicken Run","Penguin Slide","Monkey Jump",
"Cat Dash","Dog Runner","Bird Flight","Horse Race","Shark Attack",
"Ocean Defender","Deep Sea","Treasure Hunt","Island Escape","Volcano Run",
"Jungle Runner","Desert Dash","Arctic Adventure","Cave Explorer","Mountain Climb",
"Castle Defense","Tower Defense","Space Defense","Zombie Defense","Robot Defense",
"Color Shooter","Bubble Shooter","Ball Shooter","Block Shooter","Target Shooter 2",
"Pixel Wars","Tiny Warriors","Stick Fighter","Stick Archer","Stick Ninja",
"Stick Soccer","Stick Basketball","Stick Golf","Stick Tennis","Stick Boxing",
"Fire vs Water","Earth vs Air","Light vs Dark","Red vs Blue","Team Battle",
"Kingdom Rush Mini","Castle Clash","Empire Builder","City Builder","Farm Builder",
"Island Builder","Space Builder","Robot Builder","Tower Builder","Bridge Builder",
"Bridge Jump","Lava Jump","Ice Jump","Cloud Jump","Moon Jump",
"Sun Runner","Rainbow Run","Neon Dash","Cyber Jump","Future Racer",
"Retro Racer","Pixel Racer","Arcade Racer","Turbo Racer","Mega Racer",
"Classic Snake","Classic Pong","Classic Breakout","Classic Tetris","Classic Space",
"Classic Pacman","Classic Asteroids","Classic Frogger","Classic Dig Dug","Classic Galaga",
"Typing Race","Typing Ninja","Typing Master","Keyboard Rush","Word Sprint",
"Trivia Time","Sports Trivia","Movie Trivia","Game Trivia","Animal Trivia",
"History Trivia","Science Trivia","Geography Trivia","Music Trivia","Random Quiz",
"Idle Clicker","Cookie Clicker Mini","Gem Clicker","Coin Clicker","Power Clicker",
"Space Clicker","Monster Clicker","Farm Clicker","Robot Clicker","Treasure Clicker",
"Ultimate Dodge","Ultimate Runner","Ultimate Shooter","Ultimate Fighter","Ultimate Puzzle",
"Ultimate Racing","Ultimate Sports","Ultimate Arcade","Ultimate Classic","Ultimate Challenge"
];

let games = [...specialGames];

gameNames.forEach((name, i) => {
  const categories = ["arcade","action","puzzle","sports","classic"];
  const category = categories[i % categories.length];
  const emojis = ["🎮","🔥","⭐","🚀","⚡","🕹️","🎯","🏆"];
  games.push([name, category, emojis[i % emojis.length]]);
});

const gamesContainer = document.getElementById("games");

function renderGames(list = games) {
  gamesContainer.innerHTML = "";

  list.forEach((game, index) => {
    const card = document.createElement("div");
    card.className = "game-card";

    card.innerHTML = `
      <div class="game-icon">${game[2]}</div>
      <h3>${game[0]}</h3>
      <span>${game[1]}</span>
      <button onclick="playGame(${index})">PLAY</button>
    `;

    gamesContainer.appendChild(card);
  });
}

function searchGames() {
  const search = document.getElementById("search").value.toLowerCase();

  const results = games.filter(game =>
    game[0].toLowerCase().includes(search)
  );

  renderGames(results);
}

function showCategory(category) {
  if (category === "all") {
    renderGames();
    return;
  }

  renderGames(
    games.filter(game => game[1] === category)
  );
}

function playGame(index) {
  const game = games[index];

  document.getElementById("gameWindow").style.display = "block";
  document.getElementById("gameTitle").textContent = game[0];

  const area = document.getElementById("gameArea");

  /*
    These three are listed as games, but aren't redistributed here.
    Replace the links with legitimate URLs you have permission to use.
  */

  if (game[0] === "Retro Bowl") {
    area.innerHTML = `
      <div class="info-game">
        <h2>🏈 Retro Bowl</h2>
        <p>Open the official/licensed version of Retro Bowl to play.</p>
        <a class="big-button"
           href="https://www.retrobowlgame.com/"
           target="_blank">
           Open Retro Bowl
        </a>
      </div>
    `;
    return;
  }

  if (game[0] === "Balatro") {
    area.innerHTML = `
      <div class="info-game">
        <h2>🃏 Balatro</h2>
        <p>Open the legitimate version of Balatro.</p>
        <a class="big-button"
           href="https://www.playbalatro.com/"
           target="_blank">
           Open Balatro
        </a>
      </div>
    `;
    return;
  }

  if (game[0] === "Ultra Pool") {
    area.innerHTML = `
      <div class="info-game">
        <h2>🎱 Ultra Pool</h2>
        <p>Open a legitimate version of Ultra Pool.</p>
        <a class="big-button"
           href="https://www.google.com/search?q=Ultra+Pool+game"
           target="_blank">
           Find Ultra Pool
        </a>
      </div>
    `;
    return;
  }

  startMiniGame(game[0]);
}

function closeGame() {
  document.getElementById("gameWindow").style.display = "none";
  document.getElementById("gameArea").innerHTML = "";
}

function startMiniGame(name) {

  const area = document.getElementById("gameArea");

  area.innerHTML = `
    <div class="mini-game">
      <h2>${name}</h2>

      <p id="score">Score: 0</p>

      <div id="playBox">
        <button id="target">CLICK ME!</button>
      </div>

      <p>Click the target as many times as possible.</p>
      <button onclick="startMiniGame('${name.replace(/'/g,"\\'")}')">
        Restart
      </button>
    </div>
  `;

  let score = 0;

  const target = document.getElementById("target");
  const box = document.getElementById("playBox");

  target.onclick = () => {

    score++;

    document.getElementById("score").textContent =
      "Score: " + score;

    const x =
      Math.random() *
      (box.clientWidth - target.offsetWidth);

    const y =
      Math.random() *
      (box.clientHeight - target.offsetHeight);

    target.style.left = x + "px";
    target.style.top = y + "px";
  };
}

renderGames();
</script>

</body>
</html>
