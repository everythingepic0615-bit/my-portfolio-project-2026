<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Numeric Logic Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Matrix Index & Compilation Hub</h1>
        <p>A repository containing active sub-routines and operational nodes.</p>
        <div class="search-box">
            <input type="text" id="gameSearch" placeholder="Search module index..." onkeyup="filterGames()">
        </div>
    </header>

    <main class="grid-container" id="gamesGrid">
        <!-- System elements load automatically here via external script mapping -->
    </main>

    <div class="game-modal" id="gameModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame()">&times;</span>
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        let gameList = [];

        // Fetches the entire game database instantly from a secure cloud link
        async function loadGameRegistry() {
            try {
                const response = await fetch('https://githubusercontent.com');
                gameList = await response.json();
                renderGrid(gameList);
            } catch (error) {
                console.error("System node loading error:", error);
            }
        }

        const grid = document.getElementById('gamesGrid');
        function renderGrid(data) {
            grid.innerHTML = '';
            data.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>System Node ${100 + index}</h3>
                    <p class="game-title">${game.name}</p>
                    <button class="launch-btn" onclick="launchGame('${game.url}')">Initialize Node</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames() {
            const input = document.getElementById('gameSearch').value.toLowerCase();
            const filtered = gameList.filter(game => game.name.toLowerCase().includes(input));
            renderGrid(filtered);
        }

        function launchGame(url) {
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeGame();
        });

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameFrame').src = '';
        }

        // Initialize node generation on startup
        loadGameRegistry();
    </script>
</body>
</html>
