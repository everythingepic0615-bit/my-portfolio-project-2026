<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Numeric Logic Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Matrix Index & Compilation Hub</h1>
        <p>A repository containing active sub-routines and operational nodes.</p>
        <div class="search-box">
            <input type="text" id="gameSearch" placeholder="Search module index..." onkeyup="filterGames()">
        </div>
    </header>

    <main class="grid-container" id="gamesGrid">
        <!-- Built automatically by the generator script below -->
    </main>

    <div class="game-modal" id="gameModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame()">&times;</span>
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Core game configurations
        const bases = ["https://play.gnhustgames.org/", "https://gnhustgames.org/"];
        const standardNames = [
            "Balatro", "Retro Bowl", "Slope", "Drive Mad", "Tetris", "OvO", "Run 3", "Cookie Clicker", "Tunnel Rush", "Subway Surfers",
            "1v1.lol", "Minecraft Classic", "Geometry Dash", "BitLife", "Crossy Road", "Happy Wheels", "Pac-Man", "Doodle Jump", "Eaglercraft Minecraft", "Snow Rider 3D",
            "Stickman Hook", "Smash Karts", "Shell Shockers", "Zombs Royale", "Voxiom.io", "Basketball Stars", "Paper.io 2", "Slither.io", "Agar.io", "Diep.io",
            "Little Alchemy", "Infinite Craft", "The Password Game", "Suika Game", "2048", "Flappy Bird", "Temple Run 2", "Vex 7", "Vex 6", "Bad Ice Cream",
            "Gun Mayhem", "Strike Force Heroes", "Riddle School", "World's Hardest Game", "Run 2", "Moto X3M", "Moto X3M Spooky", "Moto X3M Winter", "Moto X3M Pool", "Madalin Stunt Cars 2",
            "Drift Hunters", "G-Switch 3", "Fireboy Watergirl 1", "Fireboy Watergirl 2", "Fireboy Watergirl 3", "Fireboy Watergirl 4", "Fireboy Watergirl 5", "Super Mario Bros", "Sonic", "Pokemon Emerald",
            "Pokemon FireRed", "Zelda", "Super Smash Flash 2", "Boxing Random", "Soccer Random", "Basket Random", "Volley Random", "Rooftop Snipers", "Getaway Shootout", "Bacon May Die",
            "Iron Snout", "Blumgi Ball", "Blumgi Rocket", "Drive Mad Winter", "Brain Test", "Who Is Liar", "Mine Clicker", "Block Blast", "Wood Turning", "Fruit Ninja",
            "Jetpack Joyride", "Cut the Rope", "Among Us Online", "Fall Boys", "Stumble Guys", "Chess Local", "Checkers", "Sudoku", "Minesweeper", "Solitaire",
            "Uno Online", "Texas Holdem", "Elastic Man", "Blob Opera", "Google Feud", "GeoGuessr Beta", "Akinator", "Line Rider", "Plinko Sim", "Granny Unblocked"
        ];

        // Automated generation mapping loop to build 100 nodes instantly
        const gameList = standardNames.map((name) => {
            let path = name.toLowerCase().replace(/ /g, "-").replace(/\./g, "");
            let finalUrl = bases[0] + path + "/";
            
            // Link overrides for special host platforms
            if (name === "Balatro") finalUrl = "https://tomcat.sh";
            if (name === "1v1.lol") finalUrl = "https://1v1.lol";
            if (name === "Minecraft Classic") finalUrl = "https://minecraft.net";
            if (name === "Eaglercraft Minecraft") finalUrl = "https://eaglercraft.com";
            if (name === "Smash Karts") finalUrl = "https://smashkarts.io";
            if (name === "Shell Shockers") finalUrl = "https://shellshock.io";
            if (name === "Zombs Royale") finalUrl = "https://zombsroyale.io";
            if (name === "Voxiom.io") finalUrl = "https://voxiom.io";
            if (name === "Paper.io 2") finalUrl = "https://paper-io.com";
            if (name === "Slither.io") finalUrl = "https://slither.io";
            if (name === "Agar.io") finalUrl = "https://agar.io";
            if (name === "Diep.io") finalUrl = "https://diep.io";
            if (name === "Little Alchemy") finalUrl = "https://littlealchemy.com";
            if (name === "Infinite Craft") finalUrl = "https://neal.fun";
            if (name === "The Password Game") finalUrl = "https://neal.fun";
            if (name === "Suika Game") finalUrl = "https://suikagame.com";
            if (name === "Google Feud") finalUrl = "https://googlefeud.com";
            if (name === "Akinator") finalUrl = "https://akinator.com";
            if (name === "Line Rider") finalUrl = "https://linerider.com";

            return { name: name, url: finalUrl };
        });

        const grid = document.getElementById('gamesGrid');
        function renderGrid(data) {
            grid.innerHTML = '';
            data.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>System Node ${100 + index}</h3>
                    <p class="game-title">${game.name}</p>
                    <button class="launch-btn" onclick="launchGame('${game.url}')">Initialize Node</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames() {
            const input = document.getElementById('gameSearch').value.toLowerCase();
            const filtered = gameList.filter(game => game.name.toLowerCase().includes(input));
            renderGrid(filtered);
        }

        function launchGame(url) {
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameFrame').src = '';
        }

        // Trigger dynamic compilation sequence
        renderGrid(gameList);
    </script>
</body>
</html>
