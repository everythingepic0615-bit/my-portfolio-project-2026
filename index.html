<!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Numeric Logic Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Matrix Index & Compilation Hub</h1>
        <p>A repository containing active sub-routines and operational nodes.</p>
        <div class="search-box">
            <input type="text" id="gameSearch" placeholder="Search module index..." onkeyup="filterGames()">
        </div>
    </header>

    <main class="grid-container" id="gamesGrid">
        <!-- Rendered smoothly by code below -->
    </main>

    <div class="game-modal" id="gameModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame()">&times;</span>
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Manually verified accurate game map paths
        const gameList = [
            { name: "Balatro", url: "https://tomcat.sh" },
            { name: "Retro Bowl", url: "https://gnhustgames.org" },
            { name: "Slope", url: "https://gnhustgames.org" },
            { name: "Drive Mad", url: "https://gnhustgames.org" },
            { name: "Tetris", url: "https://gnhustgames.org" },
            { name: "OvO", url: "https://gnhustgames.org" },
            { name: "Run 3", url: "https://gnhustgames.org" },
            { name: "Cookie Clicker", url: "https://gnhustgames.org" },
            { name: "Tunnel Rush", url: "https://gnhustgames.org" },
            { name: "Subway Surfers", url: "https://gnhustgames.org" },
            { name: "1v1.lol", url: "https://1v1.lol" },
            { name: "Minecraft Classic", url: "https://minecraft.net" },
            { name: "Geometry Dash", url: "https://gnhustgames.org" },
            { name: "BitLife", url: "https://gnhustgames.org" },
            { name: "Crossy Road", url: "https://gnhustgames.org" },
            { name: "Happy Wheels", url: "https://gnhustgames.org" },
            { name: "Pac-Man", url: "https://gnhustgames.org" },
            { name: "Doodle Jump", url: "https://gnhustgames.org" },
            { name: "Eaglercraft Minecraft", url: "https://eaglercraft.com" },
            { name: "Snow Rider 3D", url: "https://gnhustgames.org" },
            { name: "Stickman Hook", url: "https://gnhustgames.org" },
            { name: "Smash Karts", url: "https://smashkarts.io" },
            { name: "Shell Shockers", url: "https://shellshock.io" },
            { name: "Zombs Royale", url: "https://zombsroyale.io" },
            { name: "Voxiom.io", url: "https://voxiom.io" }
        ];

        const grid = document.getElementById('gamesGrid');
        function renderGrid(data) {
            grid.innerHTML = '';
            data.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>System Node ${100 + index}</h3>
                    <p class="game-title">${game.name}</p>
                    <div class="embed-container">
                        <iframe src="${game.url}" loading="lazy" frameborder="0" scrolling="no"></iframe>
                    </div>
                    <button class="launch-btn" onclick="launchGame('${game.url}')">Initialize Node</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames() {
            const input = document.getElementById('gameSearch').value.toLowerCase();
            const filtered = gameList.filter(game => game.name.toLowerCase().includes(input));
            renderGrid(filtered);
        }

        function launchGame(url) {
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameFrame').src = '';
        }

        renderGrid(gameList);
    </script>
</body>
</html>
